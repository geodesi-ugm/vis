<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menjaga gambut tetap basah: simulasi satu KHG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="intro">
<div id="stage">
  <canvas id="gl" data-i18n-aria="aria.gl" aria-label="Ilustrasi 3D satu KHG rekaan"></canvas>
  <div id="haze"></div>
  <div id="labels"></div>
  <div id="tip" role="status"></div>
  <header class="chrome">
    <h1 class="panel" data-i18n="intro.h1">Menjaga gambut tetap basah</h1>
    <div class="langsw panel" role="group" data-i18n-aria="lang.group" aria-label="Bahasa"><button data-lang="id">ID</button><button data-lang="en">EN</button></div>
    <div id="kpi" class="panel" aria-live="polite">
      <div class="row"><span data-i18n="kpi.label">TMA aman (≤ 0,4 m)</span><b id="kpiVal">–</b></div>
      <div class="gauge"><i id="kpiGauge"></i></div>
      <span class="day" id="kpiDay"></span>
    </div>
  </header>
  <div id="toast" role="status"></div>

  <nav id="tools" class="panel chrome" data-i18n-aria="tool.nav" aria-label="Alat tampilan">
    <button id="btnInfo" aria-expanded="false" aria-controls="infoPop" data-i18n-tip="tool.info" data-key="I">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
    <button id="btnCut" aria-pressed="false" data-i18n-tip="tool.cut" data-key="C">
      <svg viewBox="0 0 24 24"><path d="M4 16l8-8 8 8"/><path d="M12 3v18" stroke-dasharray="2 2.5"/><path d="M4 20h16"/></svg></button>
    <button id="btnKomp" aria-pressed="true" data-i18n-tip="tool.komp" data-key="K">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="2 2.5"/><path d="M4 12h16M10 12v8" stroke-dasharray="2 2.5"/></svg></button>
    <button id="btnWell" aria-pressed="false" aria-controls="wellDock" data-i18n-tip="tool.well" data-key="G">
      <svg viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M7 9l4 4 3-2 5 5"/></svg></button>
    <button id="btnLegend" aria-expanded="true" aria-controls="legendDock" data-i18n-tip="tool.legend" data-key="L">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="4" height="4" rx="1"/><rect x="4" y="15" width="4" height="4" rx="1"/><path d="M11 7h9M11 17h9"/></svg></button>
    <hr>
    <button id="resetView" data-i18n-tip="tool.reset" data-key="R">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.5"/></svg></button>
    <button id="clearPins" data-i18n-tip="tool.clear" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 21v-8"/><circle cx="12" cy="8" r="4"/><path d="M17 17l4 4M21 17l-4 4"/></svg></button>
    <button id="btnPanel" aria-expanded="true" aria-controls="card" data-i18n-tip="tool.panel" data-key="P">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18"/></svg></button>
  </nav>

  <div id="infoPop" class="pop panel" hidden>
    <h3 data-i18n="info.nav">Navigasi</h3>
    <dl>
      <dt data-i18n="info.drag"></dt><dd data-i18n="info.dragD"></dd>
      <dt data-i18n="info.rdrag"></dt><dd data-i18n="info.rdragD"></dd>
      <dt data-i18n="info.wheel"></dt><dd data-i18n="info.wheelD"></dd>
      <dt data-i18n="info.dbl"></dt><dd data-i18n="info.dblD"></dd>
      <dt data-i18n="info.touch"></dt><dd data-i18n="info.touchD"></dd>
      <dt data-i18n="info.kbd"></dt><dd data-i18n="info.kbdD"></dd>
    </dl>
    <h3 data-i18n="info.inspect"></h3>
    <p data-i18n="info.inspectP"></p>
    <h3 data-i18n="info.about"></h3>
    <p data-i18n="info.aboutP"></p>
  </div>
  <div id="cutPop" class="pop panel" hidden><label for="cutPos" data-i18n="cut.pos">Posisi potongan</label><input type="range" id="cutPos" min="-95" max="55" step="1" value="-55"></div>

  <div id="legendDock" class="panel chrome">
    <div class="legend" id="legTma">
      <span class="ttl" data-i18n="leg.tma"></span>
      <span><i class="sw" style="background:var(--ok)"></i><em data-i18n="leg.safe"></em></span>
      <span><i class="sw" style="background:var(--mod)"></i><em data-i18n="leg.mod"></em></span>
      <span><i class="sw" style="background:var(--high)"></i><em data-i18n="leg.high"></em></span>
      <span><i class="sw" style="background:var(--ext)"></i><em data-i18n="leg.ext"></em></span>
      <span><i class="sw" style="background:var(--water)"></i><em data-i18n="leg.water"></em></span>
    </div>
    <div class="legend" id="legStrat" hidden>
      <span class="ttl" data-i18n="leg.strat"></span>
      <span><i class="sw" style="background:#7FBFAF"></i><em data-i18n="leg.keep"></em></span>
      <span><i class="sw" style="background:#4C7FC0"></i><em data-i18n="leg.gate"></em></span>
      <span><i class="sw" style="background:#9C6B3C"></i><em data-i18n="leg.block"></em></span>
      <span><i class="sw" style="background:#7E5BA8"></i><em data-i18n="leg.pump"></em></span>
      <span><i class="sw" style="background:#8E2F4F"></i><em data-i18n="leg.ready"></em></span>
    </div>
  </div>

  <div id="wellDock" class="panel chrome" hidden>
    <div class="ttl" data-i18n="well.title"></div>
    <canvas id="wellChart" width="300" height="170" role="img" data-i18n-aria="well.aria" aria-label="Grafik TMA sumur pantau terhadap waktu"></canvas>
    <div class="wlegend" id="wellLeg"></div>
    <p id="wellEmpty" data-i18n="well.empty"></p>
  </div>

  <section id="card" class="panel chrome" data-i18n-aria="card.aria" aria-label="Panel cerita dan tantangan">
    <div id="story">
      <div class="cardhead"><span id="stepTxt">Adegan 1 dari 7</span><div class="dots" id="dots"></div><span class="sp"></span>
        <button class="iconbtn collapse" data-collapse data-i18n-tip="panel.collapse"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
      <h2 id="title"></h2>
      <div class="collapsible">
        <p class="lead" id="narr" aria-live="polite"></p>
        <p class="note" id="cmp" hidden></p>
      </div>
      <div class="prog" aria-hidden="true"><i id="prog"></i></div>
      <div class="controls">
        <button id="prev" data-i18n="story.prev">Sebelumnya</button>
        <button id="replay" data-i18n="story.replay">Ulangi</button>
        <button id="next" class="primary">Berikutnya</button>
      </div>
    </div>
    <div id="sandbox" hidden>
      <div class="cardhead"><span data-i18n="sb.title">Tantangan</span><span class="sp"></span><button class="link" id="toStory" data-i18n="sb.back">Kembali ke cerita</button>
        <button class="iconbtn collapse" data-collapse data-i18n-tip="panel.collapse"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
      <h2 data-i18n="sb.h">Lindungi KHG ini dari kemarau</h2>
      <div class="collapsible">
        <p class="lead" data-i18n="sb.lead"></p>
        <div class="budget">
          <div class="budget-row"><span data-i18n="sb.budget">Anggaran</span><span id="budgetTxt"></span></div>
          <div class="prog"><i id="budgetBar"></i></div>
          <div class="costs" id="costsTxt"></div>
        </div>
        <div class="tools-row">
          <button id="tGate" aria-pressed="false">Pintu air</button>
          <button id="tPump" aria-pressed="false">Estafet pompa</button>
          <div class="seg" role="group" data-i18n-aria="sb.year" aria-label="Jenis tahun"><button id="cNormal" aria-pressed="false" data-i18n="sb.normal">Normal</button><button id="cEl" aria-pressed="true" data-i18n="sb.el">El Niño</button></div>
        </div>
      </div>
      <div class="controls">
        <button class="primary" id="run">Mulai musim kemarau</button>
        <button id="reset" data-i18n="sb.reset">Atur ulang</button>
        <button id="model" data-i18n-title="sb.planTip">Lihat rencana pembanding</button>
      </div>
      <div class="result collapsible" id="sbResult" aria-live="polite" hidden></div>
    </div>
  </section>

  <div id="intro">
    <div class="wrap">
      <div class="langsw" role="group" data-i18n-aria="lang.group" aria-label="Bahasa"><button data-lang="id">ID</button><button data-lang="en">EN</button></div>
      <h1 data-i18n="intro.h1">Menjaga gambut tetap basah</h1>
      <p data-i18n="intro.p"></p>
      <div class="row"><button class="go" id="startStory" data-i18n="intro.story">Mulai cerita</button><button class="alt" id="startPlay" data-i18n="intro.play">Langsung ke tantangan</button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
